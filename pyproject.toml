[project]
name = "korum"
version = "0.1.0"
description = ""
authors = [
    {name = "kooflixy",email = "kooflixy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pytest (>=9.1.1,<10.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "korum", from = "src"}]

[tool.isort]
profile = "black"
skip = ["src/db/migrations"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
